    </p>

  <!-- Root React -->
  <div id="root"></div>

  <!-- Debug Helper -->
  <script>
    (function(){
      window.__captureLogs = [];

      const push = (t, msg) =>
        window.__captureLogs.push({
          t,
          msg,
          stack: (new Error()).stack
        });

      const originalError = console.error.bind(console);

      console.error = function(...args){
        push('error', args);
        originalError(...args);
      };

      const originalWarn = console.warn.bind(console);

      console.warn = function(...args){
        push('warn', args);
        originalWarn(...args);
      };

      window.addEventListener('error', e =>
        push('error-event', {
          message: e.message,
          filename: e.filename,
          lineno: e.lineno
        })
      );

      window.addEventListener('unhandledrejection', e =>
        push('unhandledrejection', e.reason)
      );

      setTimeout(() => {
        try {
          const root = document.getElementById('root');

          window.__captureSnapshot = {
            rootChildren: root ? root.children.length : null,
            html: document.documentElement.outerHTML.slice(0, 2000)
          };
        } catch(e) {
          push('snapshot-error', String(e));
        }
      }, 1500);
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>

</body>
